# ============================================================
# frontend - Configuración de NGINX (HTTPS)
# ============================================================
# Sirve los archivos estáticos del frontend por HTTPS Y hace de
# proxy inverso de /api hacia el API Gateway. Así el navegador
# habla SIEMPRE por HTTPS y con el MISMO origen (https://localhost:8080):
# se acepta el certificado autofirmado una sola vez y funciona todo,
# sin problemas de CORS.
# ============================================================

# ---- Servidor HTTPS principal ----
server {
    # Escucha en el puerto 443 (HTTPS) con TLS activado
    listen 443 ssl;
    # Habilita HTTP/2 (mejor rendimiento)
    http2 on;
    # Nombre del servidor (en local, localhost)
    server_name localhost;

    # Certificado y llave (montados desde ./certs del host; los mismos del gateway)
    ssl_certificate     /certs/server.crt;
    ssl_certificate_key /certs/server.key;
    # Versiones de TLS permitidas (seguras)
    ssl_protocols TLSv1.2 TLSv1.3;

    # Carpeta con los archivos estáticos (HTML/JS/CSS)
    root /usr/share/nginx/html;
    # Archivo que se sirve por defecto
    index index.html;

    # Archivos del frontend: si no existe la ruta, cae en index.html (SPA)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reenvía TODA llamada que empiece con /api al API Gateway (por HTTPS interno)
    location /api/ {
        # DNS interno de Docker para resolver el nombre del servicio en tiempo de ejecución
        resolver 127.0.0.11 valid=10s ipv6=off;
        # Variable con el destino (usar variable obliga a resolver el nombre en cada petición,
        # así sobrevive a reinicios del gateway sin tumbar NGINX)
        set $gateway https://api-gateway:8443;
        # Reenvía la petición conservando la ruta original completa (incluye el prefijo /api)
        proxy_pass $gateway$request_uri;
        # El certificado del gateway es autofirmado: no lo validamos (es tráfico interno de confianza)
        proxy_ssl_verify off;
        # Usa HTTP/1.1 hacia el upstream
        proxy_http_version 1.1;
        # Cabeceras estándar para que el backend sepa el origen real de la petición
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ---- Redirección de HTTP a HTTPS ----
# Si alguien entra por http, lo manda a la versión segura (https) en el puerto 8080
server {
    # Escucha HTTP en el puerto 80
    listen 80;
    # Nombre del servidor
    server_name localhost;
    # Redirige cualquier ruta a su equivalente en HTTPS (puerto 8080 publicado en el host)
    return 301 https://$host:8080$request_uri;
}
