# ============================================================
# Mosquitto - Configuración para AgroSmart (desarrollo)
# ============================================================
# Para producción, deberías habilitar autenticación con usuario
# y contraseña, y opcionalmente TLS también para MQTT.
# ============================================================

# Listener TCP para MQTT
# Abre el puerto 1883 para que los servicios se conecten por MQTT (TCP)
listener 1883
# Define que ese listener usa el protocolo MQTT
protocol mqtt

# Listener para WebSockets (útil si quieres consumir MQTT
# desde el navegador en el futuro)
# Abre el puerto 9001 para conexiones via WebSockets
listener 9001
# Define que ese listener usa el protocolo websockets
protocol websockets

# Permitir conexiones sin autenticación (SOLO desarrollo)
# Acepta clientes sin usuario ni contrasena (solo para desarrollo)
allow_anonymous true

# Logs
# Envia los logs a la salida estandar (stdout), util en Docker
log_dest stdout
# Registra mensajes de tipo error
log_type error
# Registra mensajes de tipo advertencia
log_type warning
# Registra mensajes de tipo aviso
log_type notice
# Registra mensajes informativos
log_type information

# Persistencia
# Activa el guardado de mensajes y suscripciones en disco
persistence true
# Carpeta donde se guardan los datos de persistencia
persistence_location /mosquitto/data/

# Tamaño máximo del mensaje (256 KB es más que suficiente)
# Limita el tamano de cada mensaje a 262144 bytes (256 KB)
message_size_limit 262144
